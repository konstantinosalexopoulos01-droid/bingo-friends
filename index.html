<title>Μπίνγκο με φίλους</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://ntfy.sh; img-src data:; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Commissioner:wght@400;600;700&display=swap">
<style>
html{color-scheme:light dark}
[hidden]{display:none!important}
/* Layout: one narrow column, phone first. Lobby = build card, Game = card + number picker. */
:root{
  --bg:#f2f5f6; --panel:#ffffff; --ink:#14252c; --muted:#5d727b; --line:#d3dde1;
  --accent:#0e7c86; --accent-ink:#ffffff; --dauber:#c2255c; --good:#2b8a3e; --warn:#b7791f;
  --font-display:"Comfortaa","Commissioner",system-ui,sans-serif;
  --font-body:"Commissioner",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d191f; --panel:#15262e; --ink:#e6eef1; --muted:#93a8b1; --line:#2a4049;
  --accent:#3cc0cc; --accent-ink:#06242a; --dauber:#ff6b9a; --good:#69db7c; --warn:#f2c14e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d191f; --panel:#15262e; --ink:#e6eef1; --muted:#93a8b1; --line:#2a4049;
  --accent:#3cc0cc; --accent-ink:#06242a; --dauber:#ff6b9a; --good:#69db7c; --warn:#f2c14e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--font-body);
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font:700 26px/1.1 var(--font-display);margin:0;letter-spacing:.5px}
h2{font:700 17px/1.2 var(--font-display);margin:0}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.round{color:var(--muted);font-size:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.muted{color:var(--muted);font-size:14px}
.players{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;display:flex;gap:6px;align-items:center;background:var(--bg)}
.chip.turn{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700}
.chip.ok::after{content:"✓";color:var(--good);font-weight:700}
.chip.me{font-weight:700}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.cell{aspect-ratio:1;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);
  font:700 clamp(15px,5vw,22px) var(--font-display);display:grid;place-items:center;padding:0;font-variant-numeric:tabular-nums;position:relative}
.cell.empty{border-style:dashed;color:var(--muted)}
.cell.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.cell.hit{background:var(--dauber);border-color:var(--dauber);color:#fff}
.pool{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pool button,.chipnum{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  font:600 15px var(--font-body);padding:0;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.pool button.pick{border-color:var(--accent);color:var(--accent);font-weight:700}
.chipnum.on{background:var(--dauber);border-color:var(--dauber);color:#fff}
.chipnum.off{color:var(--muted);opacity:.6}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row>*{min-width:0}
.grow{flex:1}
input[type=text],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.big{font:700 22px/1.2 var(--font-display)}
.last{display:flex;align-items:center;gap:12px}
.last .num{width:64px;height:64px;border-radius:50%;background:var(--dauber);color:#fff;font:700 30px var(--font-display);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);transition:width .3s}
.win{border-color:var(--good)}
.notice{color:var(--warn);font-size:14px}
.called{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.called .chipnum{font-size:12px;border-radius:6px}
#toasts{position:fixed;left:0;right:0;top:0;z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.toast{background:var(--dauber);color:#fff;font:700 20px/1.25 var(--font-display);padding:12px 20px;border-radius:14px;text-align:center;
  max-width:100%;box-shadow:0 8px 24px rgba(0,0,0,.28);animation:pop .55s cubic-bezier(.2,1.5,.4,1) both,out .4s 3.4s ease-in forwards}
.toast.self{background:var(--accent);color:var(--accent-ink)}
.toast small{display:block;font:600 13px var(--font-body);opacity:.9;margin-top:2px}
@keyframes pop{from{transform:translateY(-50px) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes out{to{opacity:0;transform:translateY(-24px)}}
#over{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(8,16,20,.82);overflow:hidden;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));animation:fade .3s both}
#over[hidden]{display:none}
#over .msg{color:#fff;text-align:center;font:700 clamp(34px,11vw,56px)/1.15 var(--font-display);animation:boom 1s cubic-bezier(.2,1.5,.4,1) both,pulse 1.2s 1s ease-in-out infinite;position:relative;z-index:1;max-width:100%;overflow-wrap:anywhere}
#over .sub{color:#fff;opacity:.8;font:600 15px var(--font-body);margin-top:14px;text-align:center;position:relative;z-index:1}
#over i{position:absolute;top:-24px;width:10px;height:16px;border-radius:2px;animation:fall linear infinite}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes boom{from{transform:scale(.2) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}.toast,#over .msg,#over,#over i{animation:none}.toast{opacity:1}#over i{display:none}}
</style>

<div id="toasts" aria-live="polite"></div>
<div id="over" hidden role="alertdialog" aria-live="assertive"><div><div class="msg" id="overMsg"></div><div class="sub">Πάτα για να κλείσει</div></div></div>
<main>
  <div class="top"><h1>Μπίνγκο</h1><span class="round" id="round"></span></div>

  <section class="panel" id="join" hidden>
    <h2>Πώς σε λένε;</h2>
    <label class="muted" for="nick">Το όνομα που θα βλέπουν οι φίλοι σου</label>
    <input type="text" id="nick" maxlength="14" autocomplete="off">
    <label class="muted" for="room">Κωδικός δωματίου (ίδιος για όλους τους φίλους σου)</label>
    <input type="text" id="room" maxlength="20" autocomplete="off" autocapitalize="none">
    <button class="btn primary" id="joinBtn">Μπες στο παιχνίδι</button>
  </section>

  <div id="app"><p class="muted">Φόρτωση…</p></div>
</main>

<script>
const SIZE = 6, N = SIZE * SIZE, POOL = 45, TARGETS = [1, 3, 6];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(3, '0');
const LINES = (() => {
  const L = [];
  const idx = [...Array(SIZE).keys()];
  for (let r = 0; r < SIZE; r++) L.push(idx.map(c => r * SIZE + c));
  for (let c = 0; c < SIZE; c++) L.push(idx.map(r => r * SIZE + c));
  L.push(idx.map(i => i * SIZE + i), idx.map(i => i * SIZE + (SIZE - 1 - i)));
  return L;
})();

let uid = null, myName = '';
let meta = null, players = {}, calls = [], wins = [];
let card = { round: 0, cells: Array(N).fill(0) };
let sel = null, busy = false, cardLoaded = false, playersLoaded = false, metaLoaded = false, joining = false;
let saveChain = Promise.resolve();

let room = '', started = false;
const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
myName = lsGet('mpingko-name');
uid = lsGet('mpingko-uid');
if (!uid) { uid = 'p' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); lsSet('mpingko-uid', uid); }

const DEFAULT_META = { round: 1, status: 'lobby', target: 6, order: [] };
const M = () => meta || DEFAULT_META;
const cardKey = () => 'mpingko-card-' + room + '-' + uid;

function msg(t) { $('#app').innerHTML = '<div class="panel"><p>' + esc(t) + '</p></div>'; }

function lineCount(cells, calledSet) {
  let n = 0;
  for (const l of LINES) if (l.every(i => cells[i] && calledSet.has(cells[i]))) n++;
  return n;
}
function roundCalls() {
  const r = M().round;
  return calls.filter(c => c.round === r).sort((a, b) => a.seq - b.seq);
}
function roundWins() { const r = M().round; return wins.filter(w => w.round === r); }

const cleanRoom = v => v.toLowerCase().replace(/[^a-z0-9α-ωάέήίόύώ_-]/g, '').slice(0, 20);

/* Όλη η κατάσταση του παιχνιδιού προκύπτει από μια λίστα γεγονότων (join, ready, call, ...).
   Τα γεγονότα ταξιδεύουν μέσω του δωρεάν ntfy.sh (θέμα = κωδικός δωματίου). */
const HOST = 'https://ntfy.sh/';
const ID_RE = /^[A-Za-z0-9_-]{1,40}$/, MAX_PLAYERS = 12, MAX_LOG = 3000, MAX_MSG = 400;
const topic = () => 'mpingko-' + room;

function reduce(evs) {
  const S = { round: 1, status: 'lobby', target: 6, order: [], players: Object.create(null), calls: [], wins: [], lines: Object.create(null), feed: [] };
  let jc = 0;
  const roundWon = () => S.wins.some(w => w.round === S.round);
  for (const e of evs) {
    const p = S.players;
    if (!e || typeof e !== 'object' || typeof e.t !== 'string' || typeof e.u !== 'string' || !ID_RE.test(e.u)) continue;
    if (e.t === 'join') {
      if (typeof e.name !== 'string' || !e.name.trim()) continue;
      if (!p[e.u] && jc < MAX_PLAYERS) p[e.u] = { name: e.name.trim().slice(0, 14), joinedAt: jc++, readyRound: 0 };
    } else if (e.t === 'ready') {
      if (p[e.u] && S.status === 'lobby') p[e.u].readyRound = e.v === 1 ? S.round : 0;
    } else if (e.t === 'target') {
      if (S.status === 'lobby' && TARGETS.includes(e.v)) S.target = e.v;
    } else if (e.t === 'start') {
      if (S.status !== 'lobby') continue;
      const order = Object.entries(p).filter(([, x]) => x.readyRound === S.round).sort((a, b) => a[1].joinedAt - b[1].joinedAt).map(([id]) => id);
      if (order.length >= 2) { S.order = order; S.status = 'playing'; S.lines = Object.create(null); }
    } else if (e.t === 'call') {
      if (S.status !== 'playing' || roundWon()) continue;
      const rc = S.calls.filter(c => c.round === S.round);
      if (e.n === 0) {
        if (!p[e.u]) continue;
      } else {
        if (!Number.isInteger(e.n) || e.n < 1 || e.n > POOL) continue;
        if (S.order[rc.length % S.order.length] !== e.u || rc.some(c => c.n === e.n)) continue;
      }
      S.calls.push({ round: S.round, seq: rc.length, n: e.n, by: e.u });
    } else if (e.t === 'win') {
      if (S.status === 'playing' && S.order.includes(e.u) && !S.wins.some(w => w.round === S.round && w.id === e.u))
        S.wins.push({ round: S.round, id: e.u, name: (p[e.u] || {}).name || '' });
    } else if (e.t === 'lines') {
      if (S.status === 'playing' && !roundWon() && S.order.includes(e.u) && Number.isInteger(e.v) && e.v >= 1 && e.v <= LINES.length && e.v > (S.lines[e.u] || 0)) {
        S.lines[e.u] = e.v;
        S.feed.push({ round: S.round, id: e.u, name: p[e.u].name, v: e.v });
      }
    } else if (e.t === 'newround') {
      if (roundWon()) { S.round++; S.status = 'lobby'; S.order = []; S.lines = Object.create(null); }
    }
  }
  return S;
}

let log = [], seen = new Set(), joinSent = false, winSentFor = 0, linesSent = 0, linesRound = 0, feed = [];
let live = false, feedShown = 0, winShownRound = 0, overTimer = null;
function send(ev) {
  return fetch(HOST + topic(), { method: 'POST', body: JSON.stringify(Object.assign({}, ev, { u: uid, ts: Date.now() })) })
    .catch(() => { $('#round').textContent = 'Χωρίς σύνδεση, δοκίμασε ξανά'; });
}
function apply() {
  log.sort((a, b) => a.time - b.time || ((+a.ev.ts || 0) - (+b.ev.ts || 0)) || (a.id < b.id ? -1 : 1));
  const S = reduce(log.map(x => x.ev));
  meta = { round: S.round, status: S.status, target: S.target, order: S.order };
  players = S.players; calls = S.calls; wins = S.wins; feed = S.feed;
  syncCardRound(); checkWin(); announce(); render();
}
function connect() {
  const es = new EventSource(HOST + topic() + '/sse?since=all');
  es.onmessage = m => {
    let d, ev;
    try {
      d = JSON.parse(m.data);
      if (d.event !== 'message' || typeof d.id !== 'string' || seen.has(d.id) || log.length >= MAX_LOG) return;
      if (typeof d.message !== 'string' || d.message.length > MAX_MSG) return;
      ev = JSON.parse(d.message);
    } catch (e) { return; }
    seen.add(d.id); log.push({ time: +d.time || 0, id: d.id, ev: ev && typeof ev === 'object' ? ev : {} }); apply();
  };
  es.onopen = () => setTimeout(() => { if (!live) { live = true; feedShown = feed.length; winShownRound = roundWins().length ? M().round : 0; } if (!players[uid] && myName && !joinSent) { joinSent = true; send({ t: 'join', name: myName }); } }, 1500);
}

function toast(html, self) {
  const t = document.createElement('div');
  t.className = 'toast' + (self ? ' self' : '');
  t.innerHTML = html;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 4000);
  try { navigator.vibrate && navigator.vibrate(self ? 60 : [60, 40, 60]); } catch (e) {}
}
function showOver(text) {
  const o = $('#over'); $('#overMsg').textContent = text;
  o.querySelectorAll('i').forEach(i => i.remove());
  const colors = ['#ff6b9a', '#3cc0cc', '#f2c14e', '#69db7c', '#ffffff'];
  for (let k = 0; k < 36; k++) {
    const c = document.createElement('i');
    c.style.cssText = 'left:' + Math.random() * 100 + '%;background:' + colors[k % colors.length] + ';animation-duration:' + (2 + Math.random() * 2.5) + 's;animation-delay:' + Math.random() * 1.5 + 's';
    o.appendChild(c);
  }
  o.hidden = false;
  clearTimeout(overTimer); overTimer = setTimeout(() => { o.hidden = true; }, 7000);
  try { navigator.vibrate && navigator.vibrate([120, 60, 120, 60, 200]); } catch (e) {}
}
function announce() {
  if (!live) return;
  const m = M();
  const w = roundWins();
  if (w.length && winShownRound !== m.round) {
    winShownRound = m.round;
    showOver(w.some(x => x.id === uid) ? 'Σας γάμησε!' : 'Ο ' + (w[0].name || 'Παίκτης') + ' γαμάει!');
  }
  for (; feedShown < feed.length; feedShown++) {
    const f = feed[feedShown];
    if (f.round !== m.round || f.v >= m.target) continue;
    const lbl = f.v + (f.v === 1 ? ' γραμμή' : ' γραμμές') + ' από ' + m.target;
    if (f.id === uid) toast('Γραμμή! <small>' + esc(lbl) + '</small>', true);
    else toast('Ο ' + esc(f.name || 'Παίκτης') + ' γαμάει! <small>' + esc(lbl) + '</small>', false);
  }
}

function boot() {
  $('#over').addEventListener('click', () => { $('#over').hidden = true; });
  $('#app').addEventListener('click', onClick);
  $('#app').addEventListener('change', onChange);
  $('#nick').value = myName;
  $('#room').value = cleanRoom(location.hash.slice(1)) || lsGet('mpingko-room');
  $('#join').hidden = false;
  $('#app').innerHTML = '';
  const go = () => {
    const n = $('#nick').value.trim(), r = cleanRoom($('#room').value);
    if (!n || !r) { $('#joinBtn').textContent = 'Γράψε όνομα και κωδικό δωματίου'; return; }
    myName = n.slice(0, 14); room = r; lsSet('mpingko-name', myName); lsSet('mpingko-room', room);
    history.replaceState(null, '', '#' + room);
    start();
  };
  $('#joinBtn').onclick = go;
  ['#nick', '#room'].forEach(q => $(q).addEventListener('keydown', e => { if (e.key === 'Enter') go(); }));
  if (myName && $('#room').value && location.hash) go();
}

function start() {
  if (started) return; started = true;
  $('#join').hidden = true;
  try {
    const v = JSON.parse(lsGet(cardKey()) || 'null');
    if (v && Array.isArray(v.cells) && v.cells.length === N) card = { round: v.round, cells: v.cells.slice() };
  } catch (e) {}
  cardLoaded = playersLoaded = metaLoaded = true;
  apply();
  connect();
}

function syncCardRound() {
  if (cardLoaded && card.round !== M().round) { card = { round: M().round, cells: Array(N).fill(0) }; sel = null; }
}
function saveCard() {
  lsSet(cardKey(), JSON.stringify({ round: card.round, cells: card.cells }));
  return Promise.resolve();
}

function checkWin() {
  const m = M();
  if (!meta || m.status !== 'playing' || !m.order.includes(uid) || card.round !== m.round) return;
  if (roundWins().some(w => w.id === uid)) return;
  const called = new Set(roundCalls().map(c => c.n).filter(Boolean));
  const lc = lineCount(card.cells, called);
  if (linesRound !== m.round) { linesRound = m.round; linesSent = 0; }
  if (lc > linesSent && lc < m.target) { linesSent = lc; send({ t: 'lines', v: lc }); }
  if (lc >= m.target && winSentFor !== m.round) {
    winSentFor = m.round;
    send({ t: 'win' });
  }
}

function ordered() { return Object.entries(players).sort((a, b) => (a[1].joinedAt || 0) - (b[1].joinedAt || 0)); }

function renderCard(mode, calledSet) {
  let h = '<div class="grid">';
  card.cells.forEach((v, i) => {
    const cls = ['cell'];
    if (!v) cls.push('empty');
    if (mode === 'build' && sel === i) cls.push('sel');
    if (mode === 'play' && v && calledSet.has(v)) cls.push('hit');
    h += '<button class="' + cls.join(' ') + '" data-act="cell" data-i="' + i + '"' + (mode === 'play' ? ' tabindex="-1"' : '') + '>' + (v || '') + '</button>';
  });
  return h + '</div>';
}

function render() {
  if (!metaLoaded || !playersLoaded || !cardLoaded) return;
  const m = M();
  $('#round').textContent = 'Δωμάτιο ' + room + ' · Γύρος ' + m.round;

  const win = roundWins();
  const callsR = roundCalls();
  const calledSet = new Set(callsR.map(c => c.n).filter(Boolean));
  const playing = m.status === 'playing';
  const inGame = m.order.includes(uid);
  const turnId = playing && m.order.length ? m.order[callsR.length % m.order.length] : null;
  const me = players[uid] || {};
  const iReady = me.readyRound === m.round;
  const nm = id => (players[id] && players[id].name) || 'Παίκτης';

  let h = '<div class="panel"><h2>Παίκτες</h2><div class="players">';
  ordered().forEach(([id, p]) => {
    const c = ['chip'];
    if (id === uid) c.push('me');
    if (!playing && p.readyRound === m.round) c.push('ok');
    if (playing && !win.length && id === turnId) c.push('turn');
    h += '<span class="' + c.join(' ') + '">' + esc(p.name || '?') + (id === uid ? ' (εσύ)' : '') + '</span>';
  });
  h += '</div></div>';

  if (!playing) {
    const ready = ordered().filter(([, p]) => p.readyRound === m.round);
    const full = card.cells.every(Boolean);
    h += '<div class="panel"><h2>Φτιάξε την κάρτα σου</h2>';
    h += '<p class="muted">Πάτα ένα τετράγωνο και μετά έναν αριθμό από κάτω. Διάλεξε ' + N + ' αριθμούς από το 1 έως το ' + POOL + ' και βάλε τους όπου θέλεις. Οι άλλοι δεν βλέπουν την κάρτα σου.</p>';
    h += renderCard(iReady ? 'play' : 'build', new Set());
    if (!iReady) {
      const used = new Set(card.cells);
      h += '<div class="pool">';
      for (let n = 1; n <= POOL; n++) if (!used.has(n)) h += '<button class="pick" data-act="put" data-n="' + n + '">' + n + '</button>';
      h += '</div>';
      h += '<div class="row"><button class="btn" data-act="random">Τυχαία συμπλήρωση</button><button class="btn" data-act="clear">Καθάρισμα</button>' +
        '<button class="btn primary grow" data-act="ready"' + (full ? '' : ' disabled') + '>Είμαι έτοιμος</button></div>';
    } else {
      h += '<div class="row"><button class="btn" data-act="unready">Αλλαγή κάρτας</button></div>';
    }
    h += '</div>';
    h += '<div class="panel"><h2>Κανόνες γύρου</h2><label class="muted" for="target">Κερδίζει όποιος πρώτος συμπληρώσει</label>' +
      '<select id="target">' + TARGETS.map(t => '<option value="' + t + '"' + (m.target === t ? ' selected' : '') + '>' + t + (t === 1 ? ' γραμμή' : ' γραμμές') + (t === 6 ? ' (ΜΠΙΝΓΚΟ)' : '') + '</option>').join('') + '</select>' +
      '<button class="btn primary" data-act="start"' + (iReady && ready.length >= 2 ? '' : ' disabled') + '>Ξεκινάμε (' + ready.length + ' έτοιμοι)</button>' +
      '<p class="muted">Χρειάζονται τουλάχιστον 2 έτοιμοι παίκτες. Στείλε το link σε όσους θέλεις να παίξουν. Μπαίνουν στο δωμάτιο «' + esc(room) + '».</p></div>';
  } else {
    const lines = inGame ? lineCount(card.cells, calledSet) : 0;
    const last = callsR.filter(c => c.n).slice(-1)[0];
    if (win.length) {
      const iWon = win.some(w => w.id === uid);
      h += '<div class="panel win">' + (iWon ? '<div class="big">Σας γάμησε!</div>' : '') +
        win.filter(w => w.id !== uid).map(w => '<div class="big">Ο ' + esc(w.name || nm(w.id)) + ' γαμάει!</div>').join('') +
        '<button class="btn primary" data-act="newround">Νέος γύρος</button></div>';
    } else {
      const mine = turnId === uid;
      h += '<div class="panel"><div class="last">' + (last ? '<div class="num">' + esc(last.n) + '</div>' : '') +
        '<div><div class="big">' + (mine ? 'Η σειρά σου!' : 'Σειρά του: ' + esc(nm(turnId))) + '</div>' +
        '<div class="muted">' + (last ? 'Τελευταίος αριθμός: ' + esc(last.n) + ' από ' + esc(nm(last.by)) : 'Ξεκινάει το παιχνίδι') + '</div></div></div>';
      if (mine) {
        h += '<div class="muted">Διάλεξε έναν αριθμό και τον σημειώνουν όλοι:</div><div class="pool">';
        for (let n = 1; n <= POOL; n++) if (!calledSet.has(n)) h += '<button class="pick" data-act="call" data-n="' + n + '"' + (busy ? ' disabled' : '') + '>' + n + '</button>';
        h += '</div>';
      } else {
        h += '<button class="btn" data-act="skip"' + (busy ? ' disabled' : '') + '>Παράλειψη σειράς (αν λείπει ο παίκτης)</button>';
      }
      h += '</div>';
    }
    if (inGame) {
      h += '<div class="panel"><h2>Η κάρτα σου</h2>' + renderCard('play', calledSet) +
        '<div class="row"><span class="muted">Γραμμές: ' + lines + ' / ' + m.target + '</span></div>' +
        '<div class="bar"><i style="width:' + Math.min(100, lines / m.target * 100) + '%"></i></div></div>';
    } else {
      h += '<p class="notice">Το παιχνίδι ξεκίνησε χωρίς εσένα. Θα παίξεις στον επόμενο γύρο.</p>';
    }
    h += '<div class="panel"><h2>Αριθμοί που ειπώθηκαν</h2><div class="called">';
    for (let n = 1; n <= POOL; n++) h += '<span class="chipnum ' + (calledSet.has(n) ? 'on' : 'off') + '">' + n + '</span>';
    h += '</div></div>';
  }
  $('#app').innerHTML = h;
}

function nextEmpty(from) {
  for (let k = 0; k < N; k++) { const i = (from + k) % N; if (!card.cells[i]) return i; }
  return null;
}

async function onClick(e) {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, m = M();
  if (act === 'cell' && m.status === 'lobby') {
    const i = +b.dataset.i;
    if (players[uid] && players[uid].readyRound === m.round) return;
    if (card.cells[i]) { card.cells[i] = 0; saveCard(); }
    sel = i; render();
  } else if (act === 'put') {
    const i = sel !== null && !card.cells[sel] ? sel : nextEmpty(0);
    if (i === null) return;
    card.cells[i] = +b.dataset.n; sel = nextEmpty(i); saveCard(); render();
  } else if (act === 'random') {
    const left = []; const used = new Set(card.cells);
    for (let n = 1; n <= POOL; n++) if (!used.has(n)) left.push(n);
    for (let k = left.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [left[k], left[j]] = [left[j], left[k]]; }
    card.cells = card.cells.map(v => v || left.pop()); sel = null; saveCard(); render();
  } else if (act === 'clear') {
    card.cells = Array(N).fill(0); sel = 0; saveCard(); render();
  } else if (act === 'ready') {
    await saveCard();
    send({ t: 'ready', v: 1 });
  } else if (act === 'unready') {
    send({ t: 'ready', v: 0 });
  } else if (act === 'start') {
    send({ t: 'start' });
  } else if (act === 'call' || act === 'skip') {
    if (busy) return; busy = true; render();
    await send({ t: 'call', n: act === 'call' ? +b.dataset.n : 0 });
    setTimeout(() => { busy = false; render(); }, 600);
  } else if (act === 'newround') {
    send({ t: 'newround' });
  }
}
function onChange(e) {
  if (e.target.id === 'target') send({ t: 'target', v: +e.target.value });
}

boot();
</script>
