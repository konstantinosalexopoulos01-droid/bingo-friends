<title>Μπίνγκο με φίλους</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://ntfy.sh; img-src data:; media-src blob:; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Commissioner:wght@400;600;700&display=swap">
<style>
html{color-scheme:light dark}
[hidden]{display:none!important}
/* Layout: one narrow column, phone first. Lobby = build card, Game = card + number picker. */
:root{
  --bg:#f2f5f6; --panel:#ffffff; --ink:#14252c; --muted:#5d727b; --line:#d3dde1;
  --accent:#0e7c86; --accent-ink:#ffffff; --dauber:#c2255c; --good:#2b8a3e; --warn:#b7791f;
  --font-display:"Comfortaa","Commissioner",system-ui,sans-serif;
  --font-body:"Commissioner",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d191f; --panel:#15262e; --ink:#e6eef1; --muted:#93a8b1; --line:#2a4049;
  --accent:#3cc0cc; --accent-ink:#06242a; --dauber:#ff6b9a; --good:#69db7c; --warn:#f2c14e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d191f; --panel:#15262e; --ink:#e6eef1; --muted:#93a8b1; --line:#2a4049;
  --accent:#3cc0cc; --accent-ink:#06242a; --dauber:#ff6b9a; --good:#69db7c; --warn:#f2c14e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--font-body);
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font:700 26px/1.1 var(--font-display);margin:0;letter-spacing:.5px}
h2{font:700 17px/1.2 var(--font-display);margin:0}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.round{color:var(--muted);font-size:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.muted{color:var(--muted);font-size:14px}
.players{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;display:flex;gap:6px;align-items:center;background:var(--bg)}
.chip.turn{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700}
.chip.ok::after{content:"✓";color:var(--good);font-weight:700}
.chip.me{font-weight:700}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{aspect-ratio:1;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);
  font:700 clamp(12px,4.2vw,19px) var(--font-display);display:grid;place-items:center;padding:0;font-variant-numeric:tabular-nums;position:relative}
.cell.empty{border-style:dashed;color:var(--muted)}
.cell.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.cell.hit{background:var(--dauber);border-color:var(--dauber);color:#fff}
.grid.s5 .cell{font-size:clamp(16px,5.8vw,25px)}
.grid.s6 .cell{font-size:clamp(14px,5vw,22px)}
.grid.s5{gap:6px}
.pool{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.pool button,.chipnum{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  font:600 15px var(--font-body);padding:0;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.pool button.pick{border-color:var(--accent);color:var(--accent);font-weight:700}
.chipnum.on{background:var(--dauber);border-color:var(--dauber);color:#fff}
.chipnum.off{color:var(--muted);opacity:.6}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row>*{min-width:0}
.grow{flex:1}
input[type=text],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.big{font:700 22px/1.2 var(--font-display)}
.last{display:flex;align-items:center;gap:12px}
.last .num{width:64px;height:64px;border-radius:50%;background:var(--dauber);color:#fff;font:700 30px var(--font-display);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);transition:width .3s}
.win{border-color:var(--good)}
.notice{color:var(--warn);font-size:14px}
.called{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.called .chipnum{font-size:12px;border-radius:6px}
#chat summary{font:700 17px/1.2 var(--font-display);cursor:pointer;display:flex;gap:8px;align-items:center}
#chat summary .badge{background:var(--dauber);color:#fff;border-radius:99px;font:700 12px var(--font-body);padding:2px 8px}
#chat[open] summary{margin-bottom:12px}
#chatList{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto;overflow-x:hidden}
#chatList:empty::before{content:"Κανένα μήνυμα ακόμα. Γράψε κάτι μόνο αν θέλεις.";color:var(--muted);font-size:14px}
.cmsg{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px;max-width:92%;align-self:flex-start;min-width:0;overflow-wrap:anywhere}
.cmsg.mine{align-self:flex-end;border-color:var(--accent)}
.cmsg b{display:block;font-size:12px;color:var(--muted);font-weight:600}
.cmsg audio{width:100%;min-width:200px;max-width:100%;height:36px;margin-top:4px;display:block}
.cmsg .err{color:var(--warn);font-size:12px}
.chatrow{display:flex;gap:8px;margin-top:12px}
.chatrow input{flex:1;min-width:0}
.chatrow .btn{flex:none;padding-inline:12px}
.btn.rec{background:var(--dauber);border-color:var(--dauber);color:#fff}
#chatNote{font-size:13px;color:var(--warn);min-height:0}
#score{display:flex;flex-direction:column;gap:6px}
#score .row2{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line);min-width:0}
#score .row2 span:first-child{overflow-wrap:anywhere;min-width:0}
#score .row2.lead{border-color:var(--good)}
#score .row2 b{font-variant-numeric:tabular-nums}
#flash{position:fixed;inset:0;z-index:70;pointer-events:none;background:var(--accent);opacity:0}
#flash.on{animation:flash 1.2s linear}
@keyframes flash{0%{opacity:.6}16%{opacity:0}33%{opacity:.6}50%{opacity:0}66%{opacity:.6}100%{opacity:0}}
.called.mine .chipnum.off{opacity:1;color:var(--ink);border-color:var(--accent);background:var(--panel);cursor:pointer}
.chipnum.sel{background:var(--accent)!important;color:var(--accent-ink)!important;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent);transform:scale(1.12);position:relative;z-index:1}
.panel.myturn{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.pickinfo{font-weight:700;color:var(--accent)}
.cell.tap{cursor:pointer}
#toasts{position:fixed;left:0;right:0;top:0;z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.toast{background:var(--dauber);color:#fff;font:700 20px/1.25 var(--font-display);padding:12px 20px;border-radius:14px;text-align:center;
  max-width:100%;box-shadow:0 8px 24px rgba(0,0,0,.28);animation:pop .55s cubic-bezier(.2,1.5,.4,1) both,out .4s 3.4s ease-in forwards}
.toast.self{background:var(--accent);color:var(--accent-ink)}
.toast small{display:block;font:600 13px var(--font-body);opacity:.9;margin-top:2px}
@keyframes pop{from{transform:translateY(-50px) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes out{to{opacity:0;transform:translateY(-24px)}}
#over{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(8,16,20,.82);overflow:hidden;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));animation:fade .3s both}
#over[hidden]{display:none}
#over .msg{color:#fff;text-align:center;font:700 clamp(34px,11vw,56px)/1.15 var(--font-display);animation:boom 1s cubic-bezier(.2,1.5,.4,1) both,pulse 1.2s 1s ease-in-out infinite;position:relative;z-index:1;max-width:100%;overflow-wrap:anywhere}
#over .sub{color:#fff;opacity:.8;font:600 15px var(--font-body);margin-top:14px;text-align:center;position:relative;z-index:1}
#over i{position:absolute;top:-24px;width:10px;height:16px;border-radius:2px;animation:fall linear infinite}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes boom{from{transform:scale(.2) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){#flash.on{animation:none}.chipnum.sel{transform:none}.bar i{transition:none}.toast,#over .msg,#over,#over i{animation:none}.toast{opacity:1}#over i{display:none}}
</style>

<div id="toasts" aria-live="polite"></div>
<div id="flash"></div>
<div id="over" hidden role="alertdialog" aria-live="assertive"><div><div class="msg" id="overMsg"></div><div class="sub">Πάτα για να κλείσει</div></div></div>
<main>
  <div class="top"><h1>Μπίνγκο</h1><span class="round" id="round"></span></div>

  <section class="panel" id="join" hidden>
    <h2>Πώς σε λένε;</h2>
    <label class="muted" for="nick">Το όνομα που θα βλέπουν οι φίλοι σου</label>
    <input type="text" id="nick" maxlength="14" autocomplete="off">
    <label class="muted" for="room">Κωδικός δωματίου (ίδιος για όλους τους φίλους σου)</label>
    <input type="text" id="room" maxlength="20" autocomplete="off" autocapitalize="none">
    <button class="btn primary" id="joinBtn">Μπες στο παιχνίδι</button>
  </section>

  <div id="app"><p class="muted">Φόρτωση…</p></div>

  <details class="panel" id="chat" hidden open>
    <summary>Chat <span class="badge" id="chatBadge" hidden></span></summary>
    <div id="chatList" aria-live="polite"></div>
    <div id="chatNote"></div>
    <div class="chatrow">
      <input type="text" id="chatText" maxlength="200" placeholder="Γράψε μήνυμα (προαιρετικό)" autocomplete="off" aria-label="Μήνυμα">
      <button class="btn primary" id="chatSend">Στείλε</button>
      <button class="btn" id="chatRec" aria-label="Ηχητικό μήνυμα">Ηχητικό</button>
    </div>
  </details>
  <p class="muted" id="ver" style="text-align:center;font-size:12px">Έκδοση 9 · κάρτα 5×5, 6×6 ή 7×7</p>
</main>

<script>
const SIZES = [5, 6, 7], POOLS = { 5: 35, 6: 45, 7: 60 };
const makeLines = size => {
  const L = [], idx = [...Array(size).keys()];
  for (let r = 0; r < size; r++) L.push(idx.map(c => r * size + c));
  for (let c = 0; c < size; c++) L.push(idx.map(r => r * size + c));
  L.push(idx.map(i => i * size + i), idx.map(i => i * size + (size - 1 - i)));
  return L;
};
const dimsCache = {};
const dimsOf = size => dimsCache[size] || (dimsCache[size] = { SIZE: size, N: size * size, POOL: POOLS[size], TARGETS: [1, 3, size], LINES: makeLines(size) });
let SIZE, N, POOL, TARGETS, LINES;
function applyDims(size) { ({ SIZE, N, POOL, TARGETS, LINES } = dimsOf(size)); }
applyDims(7);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(3, '0');

let uid = null, myName = '';
let meta = null, players = {}, calls = [], wins = [];
let card = { round: 0, size: 0, cells: [] };
let sel = null, busy = false, cardLoaded = false, playersLoaded = false, metaLoaded = false, joining = false;
let saveChain = Promise.resolve();

let room = '', started = false;
const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
myName = lsGet('mpingko-name');
uid = lsGet('mpingko-uid');
if (!uid) { uid = 'p' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); lsSet('mpingko-uid', uid); }

const DEFAULT_META = { round: 1, size: 7, status: 'lobby', target: 7, order: [] };
const M = () => meta || DEFAULT_META;
const cardKey = size => 'mpingko-card-' + room + '-' + uid + '-' + size;

function msg(t) { $('#app').innerHTML = '<div class="panel"><p>' + esc(t) + '</p></div>'; }

function lineCount(cells, calledSet) {
  let n = 0;
  for (const l of LINES) if (l.every(i => cells[i] && calledSet.has(cells[i]))) n++;
  return n;
}
function roundCalls() {
  const r = M().round;
  return calls.filter(c => c.round === r).sort((a, b) => a.seq - b.seq);
}
function roundWins() { const r = M().round; return wins.filter(w => w.round === r); }

const cleanRoom = v => v.toLowerCase().replace(/[^a-z0-9α-ωάέήίόύώ_-]/g, '').slice(0, 20);

/* Όλη η κατάσταση του παιχνιδιού προκύπτει από μια λίστα γεγονότων (join, ready, call, ...).
   Τα γεγονότα ταξιδεύουν μέσω του δωρεάν ntfy.sh (θέμα = κωδικός δωματίου). */
const HOST = 'https://ntfy.sh/';
const ID_RE = /^[A-Za-z0-9_-]{1,40}$/, MAX_PLAYERS = 12, MAX_LOG = 3000, MAX_MSG = 400;
const topic = () => 'mpingko-' + room;

function reduce(evs) {
  const S = { round: 1, size: 7, status: 'lobby', target: 7, order: [], players: Object.create(null), calls: [], wins: [], lines: Object.create(null), feed: [], scores: Object.create(null) };
  let jc = 0, D = dimsOf(7);
  const roundWon = () => S.wins.some(w => w.round === S.round);
  for (const e of evs) {
    const p = S.players;
    if (!e || typeof e !== 'object' || typeof e.t !== 'string' || typeof e.u !== 'string' || !ID_RE.test(e.u)) continue;
    if (e.t === 'join') {
      if (typeof e.name !== 'string' || !e.name.trim()) continue;
      if (!p[e.u] && jc < MAX_PLAYERS) p[e.u] = { name: e.name.trim().slice(0, 14), joinedAt: jc++, readyRound: 0 };
    } else if (e.t === 'ready') {
      if (p[e.u] && S.status === 'lobby') p[e.u].readyRound = e.v === 1 ? S.round : 0;
    } else if (e.t === 'size') {
      if (S.status === 'lobby' && SIZES.includes(e.v) && e.v !== S.size) {
        S.size = e.v; D = dimsOf(e.v); S.target = e.v;
        for (const id in p) p[id].readyRound = 0;
      }
    } else if (e.t === 'target') {
      if (S.status === 'lobby' && D.TARGETS.includes(e.v)) S.target = e.v;
    } else if (e.t === 'start') {
      if (S.status !== 'lobby') continue;
      const order = Object.entries(p).filter(([, x]) => x.readyRound === S.round).sort((a, b) => a[1].joinedAt - b[1].joinedAt).map(([id]) => id);
      if (order.length >= 2) { S.order = order; S.status = 'playing'; S.lines = Object.create(null); }
    } else if (e.t === 'call') {
      if (S.status !== 'playing' || roundWon()) continue;
      const rc = S.calls.filter(c => c.round === S.round);
      if (e.n === 0) {
        if (!p[e.u]) continue;
      } else {
        if (!Number.isInteger(e.n) || e.n < 1 || e.n > D.POOL) continue;
        if (S.order[rc.length % S.order.length] !== e.u || rc.some(c => c.n === e.n)) continue;
      }
      S.calls.push({ round: S.round, seq: rc.length, n: e.n, by: e.u });
    } else if (e.t === 'win') {
      if (S.status === 'playing' && S.order.includes(e.u) && !S.wins.some(w => w.round === S.round && w.id === e.u))
        { S.wins.push({ round: S.round, id: e.u, name: (p[e.u] || {}).name || '' }); S.scores[e.u] = (S.scores[e.u] || 0) + 1; }
    } else if (e.t === 'lines') {
      if (S.status === 'playing' && !roundWon() && S.order.includes(e.u) && Number.isInteger(e.v) && e.v >= 1 && e.v <= D.LINES.length && e.v > (S.lines[e.u] || 0)) {
        S.lines[e.u] = e.v;
        S.feed.push({ round: S.round, id: e.u, name: p[e.u].name, v: e.v });
      }
    } else if (e.t === 'newround') {
      if (roundWon()) { S.round++; S.status = 'lobby'; S.order = []; S.lines = Object.create(null); }
    }
  }
  return S;
}

let log = [], seen = new Set(), joinSent = false, winSentFor = 0, linesSent = 0, linesRound = 0, feed = [];
let pick = 0, turnKey = '', beepAudio = null, scores = {}, live = false, feedShown = 0, winShownRound = 0, overTimer = null;
function send(ev) {
  return fetch(HOST + topic(), { method: 'POST', body: JSON.stringify(Object.assign({}, ev, { u: uid, ts: Date.now() })) })
    .catch(() => { $('#round').textContent = 'Χωρίς σύνδεση, δοκίμασε ξανά'; });
}
function apply() {
  log.sort((a, b) => a.time - b.time || ((+a.ev.ts || 0) - (+b.ev.ts || 0)) || (a.id < b.id ? -1 : 1));
  const S = reduce(log.map(x => x.ev));
  meta = { round: S.round, size: S.size, status: S.status, target: S.target, order: S.order };
  applyDims(S.size);
  players = S.players; calls = S.calls; wins = S.wins; feed = S.feed; scores = S.scores;
  syncCardRound(); checkWin(); announce(); render(); renderChat();
}
function connect() {
  const es = new EventSource(HOST + topic() + '/sse?since=all');
  es.onmessage = m => {
    let d, ev;
    try {
      d = JSON.parse(m.data);
      if (d.event !== 'message' || typeof d.id !== 'string' || seen.has(d.id) || log.length >= MAX_LOG) return;
      if (typeof d.message !== 'string') return;
      if (d.message.length > (d.message.startsWith('{"t":"vchunk"') ? 4096 : MAX_MSG)) return;
      ev = JSON.parse(d.message);
    } catch (e) { return; }
    if (ev && ev.t === 'vchunk') { seen.add(d.id); if (addChunk(d, ev)) apply(); return; }
    seen.add(d.id); log.push({ time: +d.time || 0, id: d.id, att: d.attachment || null, ev: ev && typeof ev === 'object' ? ev : {} }); apply();
  };
  es.onopen = () => setTimeout(() => { if (!live) { live = true; feedShown = feed.length; winShownRound = roundWins().length ? M().round : 0; } if (!players[uid] && myName && !joinSent) { joinSent = true; send({ t: 'join', name: myName }); } }, 1500);
}

function makeBeep() {
  const sr = 22050, notes = [[880, .16], [1175, .16], [1568, .3]], gap = Math.floor(sr * .02);
  const total = notes.reduce((a, n) => a + Math.floor(sr * n[1]) + gap, 0), pcm = new Int16Array(total);
  let o = 0;
  for (const [f, d] of notes) {
    const len = Math.floor(sr * d);
    for (let i = 0; i < len; i++) pcm[o + i] = Math.sin(2 * Math.PI * f * i / sr) * Math.min(1, i / 200, (len - i) / 500) * 0.55 * 32767;
    o += len + gap;
  }
  const buf = new ArrayBuffer(44 + pcm.length * 2), v = new DataView(buf);
  const w = (at, str) => { for (let k = 0; k < str.length; k++) v.setUint8(at + k, str.charCodeAt(k)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + pcm.length * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, pcm.length * 2, true);
  new Int16Array(buf, 44).set(pcm);
  return new Audio(URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })));
}
/* Ο browser επιτρέπει ήχο μόνο μετά από πάτημα, γι' αυτό «ξεκλειδώνουμε» το audio στο πρώτο tap. */
function unlockBeep() {
  try {
    if (!beepAudio) beepAudio = makeBeep();
    if (beepAudio.dataset.ok) return;
    beepAudio.muted = true;
    beepAudio.play().then(() => { beepAudio.pause(); beepAudio.currentTime = 0; beepAudio.muted = false; beepAudio.dataset.ok = '1'; }).catch(() => { beepAudio.muted = false; });
  } catch (e) {}
}

/* Chat: κείμενο και ηχητικά. Τα ηχητικά ανεβαίνουν ως συνημμένο στο ntfy.sh και παίζονται με native player. */
let chatShown = new Set(), unread = 0, rec = null;

/* Τα ηχητικά ταξιδεύουν ως μικρά κομμάτια (vchunk) και ξαναενώνονται σε κάθε συσκευή. */
function addChunk(d, ev) {
  if (typeof ev.u !== 'string' || !ID_RE.test(ev.u) || typeof ev.vid !== 'string' || !/^[a-z0-9]{6,16}$/.test(ev.vid)) return false;
  if (!Number.isInteger(ev.i) || !Number.isInteger(ev.n) || ev.n < 1 || ev.n > 40 || ev.i < 0 || ev.i >= ev.n) return false;
  if (typeof ev.d !== 'string' || ev.d.length > 3600 || !/^[A-Za-z0-9+/=]*$/.test(ev.d) || typeof ev.mime !== 'string' || !AUDIO_RE.test(ev.mime)) return false;
  const key = ev.u + '|' + ev.vid;
  if (!voiceParts.has(key)) { if (voiceParts.size >= 60) return false; voiceParts.set(key, { n: ev.n, mime: ev.mime, parts: [], got: 0, done: false }); }
  const v = voiceParts.get(key);
  if (v.done || v.n !== ev.n || v.parts[ev.i] !== undefined) return false;
  v.parts[ev.i] = ev.d; v.got++;
  if (v.got < v.n) return false;
  let bytes;
  try { bytes = Uint8Array.from(atob(v.parts.join('')), c => c.charCodeAt(0)); } catch (e) { v.done = true; return false; }
  v.done = true;
  const url = URL.createObjectURL(new Blob([bytes], { type: v.mime.split(';')[0] }));
  localUrls.add(url);
  log.push({ time: +d.time || 0, id: 'v:' + key, att: { url, type: v.mime }, ev: { t: 'chat', voice: 1, u: ev.u, name: ev.name, ts: +ev.ts || 0 } });
  return true;
}
const chatNote = t => { $('#chatNote').textContent = t || ''; };

function toB64(buf) {
  const u = new Uint8Array(buf); let bin = '';

async function sendVoice(blob) {
  if (blob.size > VOICE_MAX_BYTES) { chatNote('Το ηχητικό βγήκε πολύ μεγάλο (' + Math.round(blob.size / 1024) + 'KB). Πες το πιο σύντομα, έως ' + VOICE_SECS + ' δευτερόλεπτα.'); return; }

      const r = await fetch(HOST + topic(), { method: 'POST', body: JSON.stringify({ t: 'vchunk', vid, i: k, n, mime, name: myName, d: b64.slice(k * CHUNK_B64, (k + 1) * CHUNK_B64), u: uid, ts: Date.now() }) });
      if (!r.ok) throw new Error('HTTP ' + r.status);

async function toggleRec() {

function nextEmpty(from) {
  for (let k = 0; k < N; k++) { const i = (from + k) % N; if (!card.cells[i]) return i; }
  return null;
}

    const i = +b.dataset.i;
    if (players[uid] && players[uid].readyRound === m.round) return;
    if (card.cells[i]) { card.cells[i] = 0; saveCard(); }
    sel = i; render();
  } else if (act === 'put') {
    const i = sel !== null && !card.cells[sel] ? sel : nextEmpty(0);
    if (i === null) return;
    card.cells[i] = +b.dataset.n; sel = nextEmpty(i); saveCard(); render();
  } else if (act === 'random') {
    const left = []; const used = new Set(card.cells);
    for (let n = 1; n <= POOL; n++) if (!used.has(n)) left.push(n);
    for (let k = left.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [left[k], left[j]] = [left[j], left[k]]; }
    card.cells = card.cells.map(v => v || left.pop()); sel = null; saveCard(); render();
  } else if (act === 'clear') {
    card.cells = Array(N).fill(0); sel = 0; saveCard(); render();
  } else if (act === 'ready') {
    await saveCard();
    send({ t: 'ready', v: 1 });
  } else if (act === 'unready') {
    send({ t: 'ready', v: 0 });
  } else if (act === 'start') {
    send({ t: 'start' });
  } else if (act === 'pick') {
    const n = +b.dataset.n;
    if (!myTurnNow() || busy || !(n >= 1 && n <= POOL) || roundCalls().some(c => c.n === n)) return;
    if (pick !== n) { pick = n; render(); return; }
    busy = true; pick = 0; render();
    await send({ t: 'call', n });
    setTimeout(() => { busy = false; render(); }, 600);
  } else if (act === 'call' || act === 'skip') {
    if (busy) return; busy = true; render();
    await send({ t: 'call', n: act === 'call' ? +b.dataset.n : 0 });
    setTimeout(() => { busy = false; render(); }, 600);
  } else if (act === 'newround') {
    send({ t: 'newround' });
  }
}
function onChange(e) {
  if (e.target.id === 'target') send({ t: 'target', v: +e.target.value });
  else if (e.target.id === 'size') send({ t: 'size', v: +e.target.value });
}

boot();
</script>
